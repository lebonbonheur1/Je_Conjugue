name: Build Android (Buildozer)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    # Étape 1 : récupérer le dépôt
    - uses: actions/checkout@v4

    # Étape 2 : configurer Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Étape 3 : installer les dépendances système nécessaires
    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3-pip openjdk-11-jdk zip unzip zlib1g-dev libncurses5 tar wget curl

    # Étape 4 : vérifier que tar est bien installé
    - name: Vérifier tar
      run: tar --version

    # Étape 5 : installer Buildozer et Cython
    - name: Install buildozer & cython
      run: |
        python -m pip install --upgrade pip
        python -m pip install buildozer==1.4.0 cython

    # Étape 6 : lancer la compilation de l’APK debug
    - name: Build APK (debug)
      run: |
        buildozer -v android debug
