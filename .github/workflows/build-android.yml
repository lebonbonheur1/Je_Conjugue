name: Build Android (Buildozer)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3-pip openjdk-11-jdk zip unzip zlib1g-dev libncurses5 tar wget curl

    - name: Install buildozer & cython
      run: |
        python -m pip install --upgrade pip
        python -m pip install buildozer==1.4.0 cython

    - name: Build APK (debug)
      run: |
        buildozer -v android debug
