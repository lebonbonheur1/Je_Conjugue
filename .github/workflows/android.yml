name: Construire APK Kivy Android

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier le code source
        uses: actions/checkout@v4

      - name: Installer Python et Buildozer
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk unzip
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Installer SDK Android et accepter les licences
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          sudo rm -rf latest
          sudo mkdir latest
          cd latest
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          sudo unzip cmdtools.zip
          sudo rm cmdtools.zip
          yes | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --update
          yes | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "tools"

      - name: S'assurer que Buildozer voit le SDK (symlink ou copie)
        run: |
          set -e
          SYSTEM_SDK="/usr/local/lib/android/sdk"
          TARGET_DIR="$HOME/.buildozer/android/platform/android-sdk"
          echo "SYSTEM_SDK=$SYSTEM_SDK"
          echo "TARGET_DIR=$TARGET_DIR"

          mkdir -p "$(dirname "$TARGET_DIR")"

          if [ -L "$TARGET_DIR" ] || [ -d "$TARGET_DIR" ]; then
            echo "Removing existing $TARGET_DIR"
            sudo rm -rf "$TARGET_DIR"
          fi

          echo "Trying to create symlink $TARGET_DIR -> $SYSTEM_SDK"
          sudo ln -s "$SYSTEM_SDK" "$TARGET_DIR" || true

          if [ -d "$TARGET_DIR/build-tools" ]; then
            echo "Symlink worked and build-tools found."
          else
            echo "Symlink did not expose build-tools. Will copy required folders."
            sudo mkdir -p "$TARGET_DIR"
            if [ -d "$SYSTEM_SDK/platform-tools" ]; then
              echo "Copying platform-tools..."
              sudo cp -a "$SYSTEM_SDK/platform-tools" "$TARGET_DIR/"
            fi
            if [ -d "$SYSTEM_SDK/build-tools" ]; then
              echo "Copying build-tools..."
              sudo cp -a "$SYSTEM_SDK/build-tools" "$TARGET_DIR/"
            fi
            if [ -d "$SYSTEM_SDK/cmdline-tools" ]; then
              sudo mkdir -p "$TARGET_DIR/cmdline-tools"
              sudo cp -a "$SYSTEM_SDK/cmdline-tools" "$TARGET_DIR/"
            fi
          fi

          echo "Final listing of $TARGET_DIR:"
          ls -la "$TARGET_DIR" || true
          ls -la "$TARGET_DIR/build-tools" || true

      - name: Générer APK
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "Aucun buildozer.spec trouvé, création d’un modèle..."
            buildozer init
          fi
          buildozer -v android debug

      - name: Sauvegarder l’APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: JeConjugue-APK
          path: bin/*.apk
