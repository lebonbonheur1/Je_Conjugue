
name: Build Kivy Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip openjdk-11-jdk python3-pip python3-dev build-essential git zip

    - name: Install Android command-line tools (cmdline-tools)
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        mkdir -p $ANDROID_SDK_ROOT
        cd /tmp
        # Télécharger les command line tools (URL "latest" fournie par Google)
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O commandlinetools.zip
        unzip -q commandlinetools.zip -d cmdline-tools-temp
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
        mv cmdline-tools-temp/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
        rm -rf cmdline-tools-temp commandlinetools.zip
        # exporter les variables d'environnement pour ce job
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

    - name: Install Android SDK packages (platform-tools, platforms, build-tools)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;36.1.0" || true
        # Si sdkmanager retourne non-zero pour certaines versions, on réessaie l'installation complète :
        sdkmanager --sdk_root=$ANDROID_HOME --install "platform-tools" "platforms;android-33" "build-tools;36.1.0"

    - name: Accept Android SDK licenses
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true

    - name: Install Python packages (Buildozer)
      run: |
        python3 -m pip install --upgrade pip
        pip install cython==0.29.34 kivy==2.3.0 buildozer

    - name: Build APK
      run: |
        buildozer -v android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
