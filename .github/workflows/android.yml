name: Build Kivy Android APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk wget git

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Install Android command-line tools
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e
          SYSTEM_SDK="$ANDROID_SDK_ROOT"
          TMP_DIR="/tmp/cmdline-tools-install"
          wget_url="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          sudo mkdir -p "$SYSTEM_SDK"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          cd "$TMP_DIR"

          wget -q "$wget_url" -O commandlinetools.zip
          unzip -q commandlinetools.zip -d cmdline-tools-temp

          TARGET="$SYSTEM_SDK/cmdline-tools/latest"
          if [ -d "$TARGET" ]; then
            sudo rm -rf "$TARGET"
          fi
          sudo mkdir -p "$TARGET"
          sudo cp -a cmdline-tools-temp/cmdline-tools/* "$TARGET"/
          rm -rf "$TMP_DIR"

          echo "ANDROID_SDK_ROOT=$SYSTEM_SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SYSTEM_SDK" >> $GITHUB_ENV
          echo "$SYSTEM_SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SYSTEM_SDK/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses || true
          sdkmanager --sdk_root=${ANDROID_SDK_ROOT} \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Verify build-tools and aidl
        run: |
          echo "Contenu de build-tools:"
          ls -la $ANDROID_SDK_ROOT/build-tools
          echo "Vérification de aidl:"
          find $ANDROID_SDK_ROOT/build-tools -name aidl

      - name: Build Kivy Android APK
        run: |
          buildozer init || true
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JeConjugue-APK
          path: bin/*.apk
